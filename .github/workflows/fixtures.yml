name: Generate FAD fixtures

on:
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyGuidos
        run: |
          python -m pip install --upgrade pip
          pip install pyguidos pillow

      - name: Generate expected outputs with pyGuidos
        run: python shared/tools/make_fixtures.py

      - uses: actions/upload-artifact@v4
        with:
          name: fad-expected
          path: shared/fixtures/expected/
